<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>リアルタイムアウトプットビューア</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="viewer">
    <h1>環境構築不要・リアルタイム可視化ページ</h1>
    <p class="lead">入力した内容をリアルタイムでビジュアル表示し、その状態のURLをそのまま共有できます。</p>

    <section class="card">
      <h2>入力（リアルタイム反映）</h2>
      <textarea id="input-text" rows="5" placeholder="ここにアウトプットを入力すると、下にリアルタイム表示されます"></textarea>
      <div class="actions">
        <button id="clear-text" type="button">クリア</button>
      </div>
    </section>

    <section class="card">
      <h2>リアルタイム表示</h2>
      <div id="live-preview" class="preview">ここにプレビューが表示されます</div>
      <p class="timestamp">最終更新: <span id="updated-at">--</span></p>
    </section>

    <section class="card">
      <h2>共有URL（この状態を再現）</h2>
      <a id="url-link" class="url-link" href="#" target="_blank" rel="noopener noreferrer">読み込み中...</a>
      <div class="actions">
        <button id="copy-url" type="button">URLをコピー</button>
      </div>
      <p id="copy-status" class="note">このURLを踏むだけで同じ内容を閲覧できます。</p>
    </section>
  </main>

  <script>
    const inputText = document.getElementById('input-text');
    const livePreview = document.getElementById('live-preview');
    const updatedAt = document.getElementById('updated-at');
    const urlLink = document.getElementById('url-link');
    const copyStatus = document.getElementById('copy-status');
    const clearTextButton = document.getElementById('clear-text');

    const params = new URLSearchParams(window.location.search);
    const initialOutput = params.get('output') || 'Daily Sprint V2 のアウトプットをここで可視化できます。';

    function nowText() {
      return new Date().toLocaleString('ja-JP');
    }

    function buildShareUrl(text) {
      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set('output', text);
      return nextUrl.toString();
    }

    function render(text) {
      const normalized = text.trim();
      livePreview.textContent = normalized || 'ここにプレビューが表示されます';
      updatedAt.textContent = nowText();

      const shareUrl = buildShareUrl(text);
      urlLink.href = shareUrl;
      urlLink.textContent = shareUrl;
    }

    inputText.value = initialOutput;
    render(initialOutput);

    inputText.addEventListener('input', (event) => {
      render(event.target.value);
      copyStatus.textContent = 'リアルタイム更新中。必要ならURLをコピーして共有してください。';
    });

    clearTextButton.addEventListener('click', () => {
      inputText.value = '';
      render('');
      copyStatus.textContent = '入力内容をクリアしました。';
    });

    document.getElementById('copy-url').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(urlLink.href);
        copyStatus.textContent = 'URLをコピーしました。貼り付けて共有できます。';
      } catch (error) {
        copyStatus.textContent = 'コピーに失敗しました。URLを手動で選択して共有してください。';
      }
    });
  </script>
</body>
</html>
